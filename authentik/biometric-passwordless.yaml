version: 1
metadata:
  name: Authentik BioKey passwordless flow
  labels:
    blueprints.goauthentik.io/description: TPM-backed Linux fingerprint passkey enrollment and sign-in
entries:
  - model: authentik_flows.flow
    id: biokey-enrollment-flow
    identifiers:
      slug: authentik-biokey-enrollment
    attrs:
      name: Authentik BioKey enrollment
      title: Add this Linux fingerprint
      designation: stage_configuration
      authentication: require_authenticated

  - model: authentik_stages_authenticator_webauthn.authenticatorwebauthnstage
    id: biokey-enrollment-stage
    identifiers:
      name: authentik-biokey-enrollment
    attrs:
      configure_flow: !KeyOf biokey-enrollment-flow
      friendly_name: Linux fingerprint
      user_verification: required
      resident_key_requirement: required
      authenticator_attachment: cross-platform
      hints:
        - security-key
      max_attempts: 3

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf biokey-enrollment-flow
      stage: !KeyOf biokey-enrollment-stage
      order: 10

  - model: authentik_flows.flow
    id: biokey-login-flow
    identifiers:
      slug: authentik-biokey-login
    attrs:
      name: Authentik BioKey passwordless login
      title: Sign in with your Linux fingerprint
      designation: authentication
      authentication: none

  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: biokey-validation-stage
    identifiers:
      name: authentik-biokey-validation
    attrs:
      device_classes:
        - webauthn
      not_configured_action: deny
      last_auth_threshold: seconds=0
      webauthn_user_verification: required
      webauthn_hints:
        - security-key

  - model: authentik_stages_user_login.userloginstage
    id: biokey-login-stage
    identifiers:
      name: authentik-biokey-login

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf biokey-login-flow
      stage: !KeyOf biokey-validation-stage
      order: 10

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf biokey-login-flow
      stage: !KeyOf biokey-login-stage
      order: 20
